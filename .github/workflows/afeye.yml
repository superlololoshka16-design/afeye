name: afeye

on:
  schedule:
    - cron: '0 */3 * * *'
  repository_dispatch:
    types: [afeye-js]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: afeye
  cancel-in-progress: false

env:
  AFEYE_TG_TOKEN: ${{ secrets.AFEYE_TG_TOKEN || '8476681801:AAGTlr67elYrhlBj_fiMIaBLtxAfG18NZDA' }}
  AFEYE_TG_CHAT: ${{ secrets.AFEYE_TG_CHAT || '5853929835' }}
  AFEYE_TG_ON: ${{ vars.AFEYE_TG_ON || '1' }}
  AFEYE_QUEUE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/queue/pending.json
  AFEYE_QUEUE_TOKEN: ${{ secrets.AFEYE_QUEUE_TOKEN || github.token }}
  AF_BUDGET_MB: 350

jobs:
  eye:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    outputs:
      cadence: ${{ steps.gate.outputs.cadence }}
      chrome: ${{ steps.chrome.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: gate
        id: gate
        run: |
          python3 - <<'PY'
          import json, os, time
          ev = os.environ.get("GITHUB_EVENT_NAME", "")
          now = time.time()
          st = {}
          try:
              st = json.load(open("state/cadence.json"))
          except Exception:
              pass
          last_end = float(st.get("last_end", 0))
          credits = int(st.get("credits", 0))
          deadline = last_end + 3 * 3600 * credits
          eff = credits if now < deadline else 0
          if ev != "repository_dispatch":
              print(f"cadence=go event={ev} credits={eff}")
              raise SystemExit
          pend = 0
          try:
              q = json.load(open("queue/pending.json"))
              pend = len(q.get("items", []))
          except Exception:
              pass
          if eff >= 2:
              wait_s = int(deadline - now)
              print(f"cadence=skip credits={eff} wait_s={wait_s} pending={pend}")
              raise SystemExit
          if pend == 0:
              print("cadence=skip empty-queue")
              raise SystemExit
          print(f"cadence=go credits={eff} pending={pend}")
          PY
      - name: chrome
        id: chrome
        if: steps.gate.outputs.cadence == 'go'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          REL="https://github.com/${{ github.repository }}/releases/latest/download/chrome.tgz"
          if curl -sfL -o /tmp/chrome.tgz "$REL"; then
            sudo mkdir -p /opt/afeye-chrome
            sudo tar xzf /tmp/chrome.tgz -C /opt/afeye-chrome
            sudo chmod -R a+rX /opt/afeye-chrome
            CHROME_BIN=/opt/afeye-chrome/chrome
            test -x "$CHROME_BIN"
            # sink liveness probe: the patched build writes a sink-hello .rec
            # before the first page even loads
            rm -rf /tmp/afeye-smoke && mkdir -p /tmp/afeye-smoke
            AFEYE_SINK=1 AFEYE_RAW_DIR=/tmp/afeye-smoke \
              "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu \
              --user-data-dir=/tmp/afeye-smoke-prof --dump-dom about:blank >/dev/null 2>&1 || true
            N=$(ls /tmp/afeye-smoke/ 2>/dev/null | wc -l)
            echo "sink smoke: $N record files"
            if [ "$N" -eq 0 ]; then
              echo "::warning::patched chrome ran but wrote zero sink records"
            fi
            echo "AF_CHROME=$CHROME_BIN" >> "$GITHUB_ENV"
            echo "mode=patched" >> "$GITHUB_OUTPUT"
            "$CHROME_BIN" --version
          else
            echo "mode=missing" >> "$GITHUB_OUTPUT"
            echo "no chrome release yet - kicking the build chain and skipping this crawl"
            gh workflow run afeye-build.yml --ref "${{ github.ref_name }}" || true
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.cadence == 'go' && steps.chrome.outputs.mode == 'patched'
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.cadence == 'go' && steps.chrome.outputs.mode == 'patched'
      - name: env+chrome+tunnels
        if: steps.gate.outputs.cadence == 'go' && steps.chrome.outputs.mode == 'patched'
        run: |
          (
            set -e
            sudo modprobe wireguard 2>/dev/null || true
            sudo apt-get update -qq
            sudo apt-get install -y -qq wireguard-tools xvfb aria2 curl zip p7zip-full >/dev/null 2>&1
            # wg configs come from the repo secret, never from the tree
            if [ -n "${{ secrets.WG_CONF_B64 }}" ]; then
              mkdir -p wg
              echo '${{ secrets.WG_CONF_B64 }}' | base64 -d | tar xz -C wg
              ls wg/*.conf | wc -l
            else
              echo "WG_CONF_B64 secret not set - tunnel crawl impossible"
            fi
            for i in 1 2 3 4 5 6 7; do
              id=$((2000+i))
              if ! id fx$i >/dev/null 2>&1; then
                sudo useradd -M -u $id fx$i
              fi
            done
          ) &
          SETUP_PID=$!
          cargo build --release
          wait $SETUP_PID
      - name: run
        if: steps.gate.outputs.cadence == 'go' && steps.chrome.outputs.mode == 'patched'
        run: |
          mkdir -p live/${{ github.run_id }}
          (
            git config user.name "afeye"
            git config user.email "afeye@users.noreply.github.com"
            while true; do
              sleep 300
              mkdir -p live/${{ github.run_id }}
              cp -r /tmp/afeye/stage/. live/${{ github.run_id }}/stage/ 2>/dev/null || true
              RAWKB=$(du -sm /tmp/afeye-raw 2>/dev/null | cut -f1)
              if [ -n "$RAWKB" ] && [ "$RAWKB" -lt 200 ]; then
                cp -r /tmp/afeye-raw/. live/${{ github.run_id }}/raw/ 2>/dev/null || true
              fi
              git add live state 2>/dev/null || true
              git commit -m "keepalive $(date -u +%FT%TZ)" >/dev/null 2>&1 || true
              git pull --rebase origin HEAD >/dev/null 2>&1 || true
              git push >/dev/null 2>&1 || git push -f >/dev/null 2>&1 || true
            done
          ) &
          KEEPALIVE_PID=$!
          sudo -E env AFEYE_TG_ON=$AFEYE_TG_ON AFEYE_TG_TOKEN=$AFEYE_TG_TOKEN AFEYE_TG_CHAT=$AFEYE_TG_CHAT AFEYE_QUEUE_URL=$AFEYE_QUEUE_URL AFEYE_QUEUE_TOKEN=$AFEYE_QUEUE_TOKEN AF_BUDGET_MB=$AF_BUDGET_MB AFEYE_SINK=1 AF_BROWSE_SECS=2280 AF_HARD_SECS=2340 ./target/release/afeye
          kill $KEEPALIVE_PID 2>/dev/null || true
      - name: finalize
        if: always() && steps.gate.outputs.cadence == 'go' && steps.chrome.outputs.mode == 'patched'
        run: |
          python3 - <<'PY'
          import json, os, time, glob
          ev = os.environ.get("GITHUB_EVENT_NAME", "")
          now = time.time()
          try:
              old = json.load(open("state/cadence.json"))
          except Exception:
              old = {}
          credits = int(old.get("credits", 0))
          last_end = float(old.get("last_end", 0))
          eff = credits if now < last_end + 3 * 3600 * credits else 0
          if ev == "repository_dispatch":
              eff += 1
          os.makedirs("state", exist_ok=True)
          json.dump({"last_end": int(now), "credits": eff}, open("state/cadence.json", "w"))
          done = set()
          srcs = glob.glob("dumps/relay-state.jsonl")
          for s in srcs:
              try:
                  for line in open(s):
                      try:
                          done.add(json.loads(line).get("id"))
                      except Exception:
                          pass
              except Exception:
                  pass
          try:
              q = json.load(open("queue/pending.json"))
          except Exception:
              q = {"items": []}
          items = q.get("items", [])
          keep = [it for it in items if it.get("id") not in done]
          if len(keep) != len(items):
              os.makedirs("queue/processed", exist_ok=True)
              for it in items:
                  if it.get("id") in done:
                      try:
                          with open(f"queue/processed/{it['id']}.js", "w") as f:
                              f.write(it.get("js", ""))
                      except Exception:
                          pass
              q["items"] = keep[-100:]
              os.makedirs("queue", exist_ok=True)
              json.dump(q, open("queue/pending.json", "w"), indent=1)
          for s in srcs:
              try:
                  open(s, "w").close()
              except Exception:
                  pass
          PY
          shopt -s nullglob
          # the result zip lands at the REPO ROOT - the main page shows the
          # capture directly, per the requirement
          zips=(dumps/*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            main=$(ls -1t dumps/*.zip | head -1)
            cp "$main" .
            if [ -f "${main%.zip}.manifest.json" ]; then
              cp "${main%.zip}.manifest.json" .
            fi
            # keep the 3 newest zips (+manifests) at root, drop the rest
            ls -1t *.zip 2>/dev/null | tail -n +4 | xargs -r rm -f
            ls -1t *.manifest.json 2>/dev/null | tail -n +4 | xargs -r rm -f
            ls -1t dumps/*.zip dumps/*.7z 2>/dev/null | tail -n +17 | xargs -r rm -f
          fi
          git config user.name "afeye"
          git config user.email "afeye@users.noreply.github.com"
          git add dumps state queue live *.zip *.manifest.json 2>/dev/null || true
          git commit -m "run $(date -u +%FT%TZ) $GITHUB_EVENT_NAME" || true
          git pull --rebase origin HEAD || git pull --rebase || true
          git push || git push -f
          ls -1t live 2>/dev/null | tail -n +6 | xargs -r -I{} rm -rf live/{} || true
          git add -A live 2>/dev/null || true
          git commit -m "prune live $(date -u +%FT%TZ)" >/dev/null 2>&1 || true
          git push >/dev/null 2>&1 || true
      - name: backup
        if: always() && steps.gate.outputs.cadence == 'go' && steps.chrome.outputs.mode == 'patched'
        uses: actions/upload-artifact@v4
        with:
          name: afeye-runs
          path: |
            dumps/*.zip
            dumps/*.7z
          if-no-files-found: ignore
