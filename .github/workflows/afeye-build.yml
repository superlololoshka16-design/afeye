name: afeye-build

# Build the afeye-patched Chromium 153 ON this runner and publish it as a
# GitHub release asset. The crawl workflow (afeye.yml) downloads
# `releases/latest/download/chrome.tgz` - cron crawls NEVER compile.
#
# MANUAL-ONLY (workflow_dispatch): pushing to main does NOT start a build.
# The build chain is started by a human (or by the crawl workflow when the
# release is missing); once started it keeps re-triggering ITSELF inside
# its 4h30m windows until the binary exists (see continue-chain below) -
# so the job NEVER hits the 6h runner cap and never dies mid-compile.
#
# Why this is fast:
#   - target is the REAL `chrome` (NOT headless_shell - the stripped test
#     app where antifraud self-checks die silently); the full platform is
#     the honest capture surface, the window chain absorbs the graph size
#   - component build: per-component .so links, not one monolith link
#   - use_lld + concurrent_links=4, symbol_level=0 everywhere (no debug
#     info): ~1/3 of a default build cut
#   - no PGO / no thin-LTO (is_official_build=false)
#   - ccache across runs via actions/cache (10G cap, 9G used)
#   - single gclient sync at the pinned tag, --no-history
#
# Why it never "gets killed": the ninja step runs inside its own timeout
# window well below the 6h job cap; a window that ends mid-build still
# saves the ccache (if: always) and re-triggers this same workflow, which
# resumes from the warm cache. The chain continues automatically until the
# binary exists, then the release is published and future runs are
# download-only.

on:
  workflow_dispatch:
    inputs:
      chromium_ref:
        description: 'chromium tag to build'
        required: false
        default: '153.0.8010.52'

permissions:
  contents: write
  actions: write

concurrency:
  group: afeye-build
  cancel-in-progress: false

env:
  CHROMIUM_REF: ${{ github.event.inputs.chromium_ref || '153.0.8010.52' }}
  WORK: /mnt/chromium
  OUT: out/afeye
  NINJA_TARGET: chrome
  BUILD_WINDOW_SECS: '16200'
  CCACHE_DIR: /mnt/ccache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - name: workspace
        run: |
          sudo mkdir -p /mnt/chromium /mnt/ccache
          sudo chown -R runner: /mnt/chromium /mnt/ccache
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache >/dev/null
          df -h / /mnt | sed 's/^/  /'

      - name: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: /mnt/ccache
          key: afeye-ccache-${{ env.CHROMIUM_REF }}-${{ github.run_id }}
          restore-keys: |
            afeye-ccache-${{ env.CHROMIUM_REF }}-
            afeye-ccache-

      - name: build
        id: build
        run: |
          rc=0
          bash scripts/build-chromium.sh || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
        continue-on-error: true

      - name: ccache-save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/ccache
          key: afeye-ccache-${{ env.CHROMIUM_REF }}-${{ github.run_id }}
        continue-on-error: true

      - name: result
        id: result
        if: always()
        run: |
          BIN="$WORK/src/$OUT/$NINJA_TARGET"
          if [ -x "$BIN" ]; then
            echo "status=built" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.build.outputs.rc }}" = "42" ]; then
            # 42 = build window exhausted mid-compile, cache carries progress
            echo "status=window" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=window" >> "$GITHUB_OUTPUT"
          fi

      - name: smoke-test patched chrome
        if: steps.result.outputs.status == 'built'
        run: |
          set -e
          cd "$WORK/src/$OUT"
          BIN="./$NINJA_TARGET"
          "$BIN" --version
          # The smoke page EXERCISES the funnels, then the census ASSERTS the
          # catches. v6 smoked on about:blank - nothing executes there, so
          # the sinks were "alive" but provably empty. This page hits every
          # hooked layer: external script (v8 compile funnels), inline script
          # + eval + new Function, a timer, a fetch, a dispatched event,
          # Function.prototype.toString, wasm bytes, canvas/audio probes.
          mkdir -p /tmp/afeye-smoke && rm -rf /tmp/afeye-smoke/*
          cat > /tmp/afeye-smoke/smoke.js <<'EOF'
          // external script: goes through the compile funnels (0002)
          function tok(a, b) { return a + b + 42; }
          document.dispatchEvent(new CustomEvent('afeye-ping'));
          addEventListener('mousemove', function () {});
          // timer: dom_timer install+fire (0006)
          setTimeout(function () {
            // fetch: resource_fetcher (0006) + network wire (0011)
            fetch('probe.txt').then(function (r) {
              return r.text();
            }).catch(function () {});
            // integrity self-check surface (0004)
            Function.prototype.toString.call(tok);
            // wasm: bytes + instantiate (0003)
            if (typeof WebAssembly === 'object') {
              try {
                var b = new Uint8Array([0,97,115,109,1,0,0,0]);
                WebAssembly.instantiate(b);
              } catch (e) {}
            }
            // eval + new Function: the GetFunctionFromEval funnel (0002)
            eval('1+1');
            new Function('return 2')();
            // v9 smoke surfaces (0012-0019):
            // clock: Date.now (v8 builtin 0004 -> v8:clock) and
            // performance.now (blink 0012 -> blink:clock), both kind 33
            Date.now();
            performance.now();
            // canvas export result (0012/0014) + draw-text input (0019)
            try {
              var cv = document.createElement('canvas');
              cv.width = 16; cv.height = 16;
              var cx = cv.getContext('2d');
              cx.fillText('afeye', 1, 1);
              cx.getImageData(0, 0, 4, 4);
              cv.toDataURL('image/png');
            } catch (e) {}
            // cookie + storage VALUES (0013, kind 16)
            document.cookie = 'afeye=smoke';
            try {
              localStorage.setItem('afeye', 'smoke');
              localStorage.getItem('afeye');
            } catch (e) {}
            // taint edges (0016, kind 37): TE/btoa/FormData/USP
            new TextEncoder().encode('afeye-taint');
            btoa('afeye-b64');
            try {
              var fd = new FormData(); fd.append('afeye', 'smoke');
              new URLSearchParams({afeye: 'smoke'}).toString();
            } catch (e) {}
            // fp VALUES (0019, kind 16): computed style, fonts.check,
            // matchMedia + matches, permissions.query
            try {
              getComputedStyle(document.body).getPropertyValue('font-family');
              getComputedStyle(document.body).fontFamily;
              document.fonts.check('16px "Arial"');
              var mql = matchMedia('(min-width: 1px)'); mql.matches;
              navigator.permissions.query({name: 'notifications'});
              Notification.permission;
            } catch (e) {}
            // v10 surfaces (0020-0022):
            // JSON.stringify result (0021 -> kind 16 json-stringify)
            JSON.stringify({afeye: 'smoke'});
            // Error.stack materialization (0021 -> kind 38)
            try { new Error('afeye-stack').stack; } catch (e) {}
            // GOPD over a DOM object (0022 -> kind 16 gopd; navigator is a
            // special receiver so it crosses the C++ funnel)
            try { Object.getOwnPropertyDescriptor(Navigator.prototype, 'userAgent'); } catch (e) {}
            // lazy-compile firstcall (0022 -> kind 8 lazy-compile): the
            // function below is first called here, inside the timer
            (function afeyeLazy() { return 1; })();
            // Date ctor clock (0022 -> kind 33 clock date-ctor)
            new Date();
            // wasm streaming path needs a network Response; smoke asserts
            // buffered wasm only (0003) - streaming verified by census on
            // real antifraud loads
          }, 30);
          EOF
          cat > /tmp/afeye-smoke/smoke.html <<'EOF'
          <!doctype html><html><head><title>afeye-smoke</title></head><body>
          <script src="smoke.js"></script>
          <script>/* inline: another compile-funnel catch */
            document.title = 'inline';
          </script></body></html>
          EOF
          echo "afeye-smoke-ok" > /tmp/afeye-smoke/probe.txt
          (cd /tmp/afeye-smoke && python3 -m http.server 8099 >/dev/null 2>&1 &)
          sleep 1
          # --headless on the REAL chrome binary (since 132 this IS the full new
          # headless - the old stripped headless is gone): full platform, no X
          timeout 45 env AFEYE_SINK=1 AFEYE_RAW_DIR=/tmp/afeye-smoke/rec \
            "$BIN" --headless --no-sandbox --disable-gpu \
            --user-data-dir=/tmp/afeye-smoke-prof --virtual-time-budget=10000 \
            --dump-dom http://127.0.0.1:8099/smoke.html >/dev/null 2>&1 || true
          pkill -f "http.server 8099" || true
          sleep 1
          ls -la /tmp/afeye-smoke/rec/ || true
          # THE assertion: real records, real kinds - not just live .rec files
          python3 "$GITHUB_WORKSPACE/tools/rec_census.py" /tmp/afeye-smoke/rec \
            --expect v8:script-source=2 \
            --expect v8:call-completed=1 \
            --expect v8:clock=1 \
            --expect blink:clock=1 \
            --expect blink:event-dispatch=1 \
            --expect blink:timer=1 \
            --expect blink:fetch=1 \
            --expect blink:dom-api=1 \
            --expect blink:fingerprint=1 \
            --expect blink:taint-edge=1 \
            --expect v8:fingerprint=1 \
            --expect v8:error-stack=1 \
            --expect net:net-request=1

      - name: package + release
        if: steps.result.outputs.status == 'built'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd "$WORK/src/$OUT"
          # Runtime payload: the binary + THE WHOLE component .so set. v6
          # shipped a hard-coded file list - in a component build the
          # binary loads dozens of lib*.so at startup, and a missing one
          # means "error while loading shared libraries" on the target
          # machine. One tar with exclusion patterns over the out dir is
          # deterministic: binary, every .so, resources.pak, icudtl.dat,
          # snapshot blobs, locales, vk_swiftshader, crashpad handler.
          tar czf /tmp/chrome.tgz \
            --exclude='./obj*' --exclude='./gen' \
            --exclude='*.ninja' --exclude='*.ninja.*' \
            --exclude='./toolchain.ninja' --exclude='./args.gn' \
            --exclude='./build.ninja' --exclude='*.stamp' \
            --exclude='*.TOC' --exclude='*.a' \
            --exclude='./gen' .
          # sanity: the tar must contain the binary + at least the core .so
          # set, else the archive is a brick (fail loudly, not on the
          # target machine).
          test "$(tar tzf /tmp/chrome.tgz | grep -c '^\./chrome$')" -ge 1
          test "$(tar tzf /tmp/chrome.tgz | grep -c '\.so$')" -ge 10
          test "$(tar tzf /tmp/chrome.tgz | grep -c 'icudtl.dat')" -ge 1
          ls -la /tmp/chrome.tgz
          sha256sum /tmp/chrome.tgz | tee /tmp/chrome.tgz.sha256
          TAG="chrome-${CHROMIUM_REF}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/chrome.tgz /tmp/chrome.tgz.sha256 --clobber
          else
            gh release create "$TAG" /tmp/chrome.tgz /tmp/chrome.tgz.sha256 \
              --title "afeye $NINJA_TARGET $CHROMIUM_REF" \
              --notes "Patched Chromium $CHROMIUM_REF, REAL chrome target (v7). v6 built headless_shell - the stripped test binary where antifraud self-checks die silently; this is the full platform, run with --headless. Build fixes: afeye defines promoted to global extra_cflags (the v6 nested-GN-scope bug compiled the whole v8 layer to nothing), component .so set packaged (no more error while loading shared libraries), smoke test asserts real record kinds via tools/rec_census.py instead of about:blank emptiness. Capture surface: every script source (v8 compile funnels - eval/streamed/buffered, per-isolate names), the Invoke funnel (every C++->JS entry incl. Script::Run, microtasks, comparators - deeper than v6's api.cc hook), wasm module bytes + imports as resolved at instantiation, Function.prototype.toString integrity probes, Date.now cadence, microtask drain brackets, every event dispatch + listeners-reached fact (isTrusted + coords + keys), input at the source managers, timers, EVERY WebIDL attribute get/set + method call, DOM/canvas/font metrics incl. measured results, WebGL parameter sweep, offline audio, WebRTC SDP/ICE, device identities, crypto ops, structured clones, renderer-side fetch provenance, navigation-start T0, full network wire + WebSocket frames. External filtering (src/sinkfilter.rs): chain-merge per isolate, backward slicing with fingerprint-read taint, payload-formation windows, and v7 dead-end classification - chains are split into token-forming vs dead-end with reasons, the filtered zip keeps only what feeds the challenge token, the raw run zip stays untouched. ccache chain: after the first build only the patched translation units recompile."
          fi
          # marker into the repo tree so the main page shows the build state
          mkdir -p build
          {
            echo "target=$NINJA_TARGET"
            echo "tag=$TAG"
            echo "chromium=$CHROMIUM_REF"
            echo "sha256=$(cut -d' ' -f1 /tmp/chrome.tgz.sha256)"
            echo "built=$(date -u +%FT%TZ)"
            echo "bytes=$(stat -c%s /tmp/chrome.tgz)"
          } > build/BUILT.txt
          git config user.name "afeye-build"
          git config user.email "afeye-build@users.noreply.github.com"
          git add build/BUILT.txt
          git commit -m "$NINJA_TARGET build $CHROMIUM_REF $(date -u +%FT%TZ)" || true
          git pull --rebase origin HEAD || true
          git push || true

      - name: continue-chain
        if: steps.result.outputs.status != 'failed' && steps.result.outputs.status != 'built'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "window exhausted - re-triggering the build chain (cache carries the progress)"
          sleep 30
          gh workflow run afeye-build.yml --ref "${{ github.ref_name }}" -f chromium_ref="$CHROMIUM_REF" || true

      - name: fail-loudly
        if: steps.result.outputs.status == 'failed'
        run: |
          echo "REAL BUILD FAILURE - see the build step log"
          exit 1
