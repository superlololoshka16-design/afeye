name: afeye-build

# Build the afeye-patched Chromium 153 ON this runner and publish it as a
# GitHub release asset. The crawl workflow (afeye.yml) downloads
# `releases/latest/download/chrome.tgz` - cron crawls NEVER compile.
#
# Why this is fast:
#   - symbol_level=0 everywhere (no debug info): ~1/3 of a default build cut
#   - no PGO / no thin-LTO (is_official_build=false)
#   - ccache across runs via actions/cache (10G cap, 9G used)
#   - single gclient sync at the pinned tag, --no-history
#   - only the `chrome` target
#
# Why it never "gets killed": the ninja step runs inside its own timeout
# window well below the 6h job cap; a window that ends mid-build still saves
# the ccache (if: always) and re-triggers this same workflow, which resumes
# from the warm cache. The chain continues automatically until the binary
# exists, then the release is published and future runs are download-only.

on:
  workflow_dispatch:
    inputs:
      chromium_ref:
        description: 'chromium tag to build'
        required: false
        default: '153.0.8010.52'
  push:
    branches: [main]
    paths: ['patches/**', 'scripts/build-chromium.sh', '.github/workflows/afeye-build.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: afeye-build
  cancel-in-progress: false

env:
  CHROMIUM_REF: ${{ github.event.inputs.chromium_ref || '153.0.8010.52' }}
  WORK: /mnt/chromium
  OUT: out/afeye
  BUILD_WINDOW_SECS: '16200'
  CCACHE_DIR: /mnt/ccache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
      - uses: actions/checkout@v4

      - name: workspace
        run: |
          sudo mkdir -p /mnt/chromium /mnt/ccache
          sudo chown -R runner: /mnt/chromium /mnt/ccache
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache >/dev/null
          df -h / /mnt | sed 's/^/  /'

      - name: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: /mnt/ccache
          key: afeye-ccache-${{ env.CHROMIUM_REF }}-${{ github.run_id }}
          restore-keys: |
            afeye-ccache-${{ env.CHROMIUM_REF }}-
            afeye-ccache-

      - name: build
        id: build
        run: |
          rc=0
          bash scripts/build-chromium.sh || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc
        continue-on-error: true

      - name: ccache-save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/ccache
          key: afeye-ccache-${{ env.CHROMIUM_REF }}-${{ github.run_id }}
        continue-on-error: true

      - name: result
        id: result
        if: always()
        run: |
          if [ -x "$WORK/src/$OUT/chrome" ]; then
            echo "status=built" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.build.outputs.rc }}" = "42" ]; then
            # 42 = build window exhausted mid-compile, cache carries progress
            echo "status=window" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=window" >> "$GITHUB_OUTPUT"
          fi

      - name: smoke-test patched chrome
        if: steps.result.outputs.status == 'built'
        run: |
          cd "$WORK/src/$OUT"
          ./chrome --version
          # sink activation probe: run with AFEYE_SINK=1 and check the .rec appears
          rm -rf /tmp/afeye-smoke && mkdir -p /tmp/afeye-smoke
          AFEYE_SINK=1 AFEYE_RAW_DIR=/tmp/afeye-smoke \
            ./chrome --headless=new --no-sandbox --disable-gpu --user-data-dir=/tmp/afeye-smoke-prof \
            --dump-dom about:blank >/dev/null 2>&1 || true
          ls -la /tmp/afeye-smoke/ || true
          test -n "$(ls /tmp/afeye-smoke/ 2>/dev/null)" || { echo "SINKS DID NOT EMIT"; exit 1; }
          echo "sinks alive: $(ls /tmp/afeye-smoke/ | wc -l) record files"

      - name: package + release
        if: steps.result.outputs.status == 'built'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cd "$WORK/src/$OUT"
          # runtime payload only - the build tree (obj/gen) is not shipped
          tar czf /tmp/chrome.tgz \
            --exclude='obj*' --exclude='gen' --exclude='*.ninja' --exclude='*.ninja.*' \
            --exclude='toolchain.ninja' --exclude='args.gn' --exclude='build.ninja' \
            --exclude='*.stamp' --exclude='libc++.a' --exclude='*.TOC' \
            chrome chrome_crashpad_handler icudtl.dat resources.pak \
            snapshot_blob.bin v8_context_snapshot.bin locales \
            libEGL.so libGLESv2.so libvk_swiftshader.so vk_swiftshader_icd.json 2>/dev/null \
          || tar czf /tmp/chrome.tgz --exclude='obj*' --exclude='gen' --exclude='*.ninja' .
          ls -la /tmp/chrome.tgz
          sha256sum /tmp/chrome.tgz | tee /tmp/chrome.tgz.sha256
          TAG="chrome-${CHROMIUM_REF}"
          gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null || true
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/chrome.tgz /tmp/chrome.tgz.sha256 --clobber
          else
            gh release create "$TAG" /tmp/chrome.tgz /tmp/chrome.tgz.sha256 \
              --title "afeye chrome $CHROMIUM_REF" \
              --notes "Patched Chromium $CHROMIUM_REF with the afeye sink series (patches/SERIES.md). Restored via actions/cache-built ccache; cron crawls download this asset instead of compiling."
          fi
          # marker into the repo tree so the main page shows the build state
          mkdir -p build
          {
            echo "tag=$TAG"
            echo "chromium=$CHROMIUM_REF"
            echo "sha256=$(cut -d' ' -f1 /tmp/chrome.tgz.sha256)"
            echo "built=$(date -u +%FT%TZ)"
            echo "bytes=$(stat -c%s /tmp/chrome.tgz)"
          } > build/BUILT.txt
          git config user.name "afeye-build"
          git config user.email "afeye-build@users.noreply.github.com"
          git add build/BUILT.txt
          git commit -m "chrome build $CHROMIUM_REF $(date -u +%FT%TZ)" || true
          git pull --rebase origin HEAD || true
          git push || true

      - name: continue-chain
        if: steps.result.outputs.status != 'failed' && steps.result.outputs.status != 'built'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "window exhausted - re-triggering the build chain (cache carries the progress)"
          sleep 30
          gh workflow run afeye-build.yml --ref "${{ github.ref_name }}" -f chromium_ref="$CHROMIUM_REF" || true

      - name: fail-loudly
        if: steps.result.outputs.status == 'failed'
        run: |
          echo "REAL BUILD FAILURE - see the build step log"
          exit 1
